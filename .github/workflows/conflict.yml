name: Conflict Sync 3D Portfolio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/DreamersJS/3D-portfolio.git || true
          git fetch upstream

      - name: Create or reset sync branch
        run: |
          git checkout -B sync-upstream

      - name: Merge upstream (leave conflicts)
        run: |
          git merge upstream/main --allow-unrelated-histories || true

      - name: Show status
        run: git status

      - name: Push branch with conflicts
        run: |
          git push origin sync-upstream --force
