name: Sync Portfolio 3D with Upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/DreamersJS/3D-portfolio.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Reset to upstream
        run: |
          git checkout main
          git reset --hard upstream/main

      - name: Push synced changes
        run: git push origin main --force
