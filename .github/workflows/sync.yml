name: Sync 3D Portfolio

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  
jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set Git identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/DreamersJS/3D-portfolio.git
          git fetch upstream

      - name: Create sync branch
        run: |
          git checkout -b sync-upstream

      - name: Merge upstream manually
        run: |
          git merge upstream/main || true

      - name: Push branch
        run: |
          git push origin sync-upstream --force

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sync-upstream
          title: "Manual upstream sync"
          body: |
            Review conflicts and choose files manually.
